name: Testing

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  lint:
    runs-on: macos-15
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.3'
    - uses: actions/checkout@v3
    - name: Install Bundle
      run: bundle install
    - name: Install SwiftLint
      run: brew install swiftlint
    - name: Run swiftlint
      run: bundle exec fastlane lint

  test:
    needs: lint
    runs-on: macos-15
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.3'
    - uses: actions/checkout@v3
    - name: Install Bundle
      run: bundle install
    - name: Run unit tests
      run: bundle exec fastlane tests
